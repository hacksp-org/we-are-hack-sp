<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://cdn.hacksp.org/brand/logos/logo-stacked-white.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Hackathons feitos por e para estudantes do Ensino Médio em São Paulo."
    />
    <title>Hack SP — Hackathons para estudantes em São Paulo</title>
    <link rel="canonical" href="https://hacksp.org/" />

    <!--
      Cartão de link. Sem isto, o site compartilhado no WhatsApp ou no Discord
      aparecia como um retângulo cinza com a URL — que é onde a maior parte da
      divulgação acontece. A imagem é JPEG de propósito: vários leitores de
      prévia ainda não abrem WebP, e um cartão sem imagem é pior do que 80 KB.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hack SP" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://hacksp.org/" />
    <meta property="og:title" content="Hack SP — Hackathons para estudantes em São Paulo" />
    <meta
      property="og:description"
      content="Fins de semana em que estudantes do Ensino Médio constroem o primeiro projeto da vida. Gratuito."
    />
    <meta property="og:image" content="https://hacksp.org/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Participantes de um hackathon do Hack SP" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hack SP — Hackathons para estudantes em São Paulo" />
    <meta
      name="twitter:description"
      content="Fins de semana em que estudantes do Ensino Médio constroem o primeiro projeto da vida. Gratuito."
    />
    <meta name="twitter:image" content="https://hacksp.org/og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
